[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "item-value-estimator"
version = "0.1.0"
description = "Item value estimator"
readme = "README.md"
requires-python = "~=3.12.0"

dependencies = [
    "langgraph>=1.0.4",
    "langsmith>=0.4.56",
    "opentelemetry-exporter-otlp>=1.39.0",
    "pydantic~=2.12.5",
    "pydantic-ai>=1.27.0",
    "pydantic-ai-slim[openai]>=1.27.0",
    "pydantic-settings~=2.12.0",
    "streamlit~=1.52.1",
]

[dependency-groups]
dev = [
    "mypy~=1.19.0",
    "poethepoet~=0.38.0",
    "ruff~=0.14.8",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.poe.tasks]
lint = "ruff check"
style = "ruff check --fix"
format = "ruff format"
typecheck = "mypy ."
check = [
    { ref = "lint" },
    { ref = "format" },
    { ref = "typecheck" },
]
run = "streamlit run src/item_value_estimator/streamlit.py"
